name: Resume Architect checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering dependency
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint Claude skill
        run: python .claude/skills/resume-architect/scripts/skill_lint.py
      - name: Evidence gate valid example
        run: python .claude/skills/resume-architect/scripts/evidence_gate.py examples/candidate_verified.json
      - name: Evidence gate must reject unsupported example
        run: |
          if python .claude/skills/resume-architect/scripts/evidence_gate.py examples/candidate_blocked.json; then
            echo "ERROR: rejected fixture incorrectly passed"
            exit 1
          fi
      - name: JD requirement coverage
        run: python .claude/skills/resume-architect/scripts/jd_match.py examples/candidate_verified.json examples/job-description.txt --output work/jd-match.json
      - name: Tailoring evidence and 30 percent edit-budget gate
        run: |
          python .claude/skills/resume-architect/scripts/tailor_gate.py \
            examples/candidate_verified.json examples/candidate_tailored.json \
            --jd examples/job-description.txt --target 0.20 --report work/tailoring-report.json
      - name: Render and audit DOCX
        run: |
          mkdir -p work
          python .claude/skills/resume-architect/scripts/render_resume.py examples/candidate_verified.json work/example.docx
          python .claude/skills/resume-architect/scripts/docx_audit.py work/example.docx
